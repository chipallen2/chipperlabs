<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chipper Labs LLC</title>
<meta name="description" content="Chipper Labs LLC is a software company that builds and operates online platforms and mobile applications for businesses and consumers.">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #0a2a4a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
  }
  img.logo { width: min(520px, 90vw); height: auto; }
  h1 {
    margin-top: 40px;
    font-size: 28px;
    font-weight: 600;
    line-height: 1.3;
  }
  p {
    margin-top: 16px;
    font-size: 17px;
    line-height: 1.6;
    color: #3d5a76;
    max-width: 560px;
  }
  a.contact {
    margin-top: 32px;
    display: inline-block;
    font-size: 17px;
    font-weight: 600;
    color: #ffffff;
    background: linear-gradient(90deg, #2563eb, #a855f7, #ec4899);
    padding: 12px 28px;
    border-radius: 999px;
    text-decoration: none;
  }
  footer {
    text-align: center;
    padding: 24px;
    font-size: 14px;
    color: #7a93ab;
    border-top: 1px solid #eef2f6;
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="/logo.svg" alt="Chipper Labs">
    <h1>Software that makes everyday work easier.</h1>
    <p>Chipper Labs LLC is a software company based in Vista, California. We build and operate online platforms and mobile applications for businesses and consumers.</p>
    <a class="contact" href="mailto:chip@chipperlabs.co">chip@chipperlabs.co</a>
  </main>
  <footer>&copy; 2026 Chipper Labs LLC &middot; Vista, California</footer>
</body>
</html>
